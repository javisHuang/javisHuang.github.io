<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GZIP Hex / Apache Log 解壓工具</title>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 20px;
      background: #f5f5f5;
      color: #222;
    }
    textarea {
      width: 100%;
      min-height: 300px;
      box-sizing: border-box;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
    button {
      margin: 10px 5px 10px 0;
      padding: 9px 18px;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    #decompress {
      background: #1976d2;
      color: white;
    }
    #clear {
      background: #ddd;
    }
    #copy {
      background: #388e3c;
      color: white;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      background: white;
      border-left: 4px solid #1976d2;
      white-space: pre-wrap;
    }
    .success {
      border-left-color: #388e3c;
    }
    .error {
      border-left-color: #d32f2f;
      color: #d32f2f;
    }
    pre {
      background: #1e1e1e;
      color: #ddd;
      padding: 15px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      min-height: 150px;
    }
    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
<h2>GZIP Hex / Apache Log → JSON 解壓工具</h2>
<p>
  支援：
  <br>
  ① 完整 Apache <code>org.apache.http.wire</code> log
  <br>
  ② 直接貼 <code>[0x1f][0x8b]...</code> GZIP 資料
</p>
<textarea
        id="input"
        placeholder="[0x1f][0x8b][0x8][0x0]...[0xab]VJ[0xce]OIU..."
></textarea>
<br>
<button id="decompress">解壓 GZIP</button>
<button id="copy">複製結果</button>
<button id="clear">清除</button>
<div id="status" class="status">
  尚未處理資料
</div>
<h3>結果</h3>
<pre id="output"></pre>
<script>
  /* ============================================================
   * Wire text → Uint8Array
   *
   * 支援：
   *
   * [0x1f]
   * [0x8b]
   * [\r]
   * [\n]
   * [\t]
   *
   * 以及普通 ASCII：
   *
   * VJ
   * OIU
   * b
   *
   * ============================================================ */
  function parseWireBytes(text) {
    const bytes = [];
    let i = 0;
    while (i < text.length) {
      /*
       * [0xXX]
       */
      if (text.startsWith('[0x', i)) {
        const end =
                text.indexOf(']', i);
        if (end !== -1) {
          const hex =
                  text.substring(i + 3, end);
          if (/^[0-9a-fA-F]{1,2}$/.test(hex)) {
            bytes.push(
                    parseInt(hex, 16)
            );
            i = end + 1;
            continue;
          }
        }
      }
      /*
       * [\r]
       */
      if (text.startsWith('[\\r]', i)) {
        bytes.push(0x0d);
        i += 4;
        continue;
      }
      /*
       * [\n]
       */
      if (text.startsWith('[\\n]', i)) {
        bytes.push(0x0a);
        i += 4;
        continue;
      }
      /*
       * [\t]
       */
      if (text.startsWith('[\\t]', i)) {
        bytes.push(0x09);
        i += 4;
        continue;
      }
      /*
       * [\b]
       */
      if (text.startsWith('[\\b]', i)) {
        bytes.push(0x08);
        i += 4;
        continue;
      }
      /*
       * 普通 ASCII
       */
      const code =
              text.charCodeAt(i);
      if (code <= 0x7f) {
        bytes.push(code);
        i++;
        continue;
      }
      /*
       * 非 ASCII 字元
       */
      const encoded =
              new TextEncoder().encode(
                      text[i]
              );
      for (const b of encoded) {
        bytes.push(b);
      }
      i++;
    }
    return new Uint8Array(bytes);
  }
  /* ============================================================
   * 找 GZIP 起點
   *
   * GZIP magic:
   *
   * 1F 8B
   * ============================================================ */
  function findGzipStart(bytes) {
    for (
            let i = 0;
            i < bytes.length - 1;
            i++
    ) {
      if (
              bytes[i] === 0x1f &&
              bytes[i + 1] === 0x8b
      ) {
        return i;
      }
    }
    return -1;
  }
  /* ============================================================
   * 從完整 Apache log 中抽出 << "..."
   *
   * 如果使用者貼的是：
   *
   * 2026... << "[0x1f][0x8b]..."
   *
   * 就把 quote 裡面的內容拿出來。
   *
   * ============================================================ */
  function extractApacheWireText(raw) {
    const parts = [];
    /*
     * Apache wire：
     *
     * << "xxxxx"
     */
    const regex =
            /<<\s*"((?:\\.|[^"])*)"/g;
    let match;
    while (
            (match = regex.exec(raw)) !== null
            ) {
      parts.push(match[1]);
    }
    /*
     * 找得到 Apache wire message
     */
    if (parts.length > 0) {
      return parts.join('');
    }
    /*
     * 如果沒有 << "..."
     *
     * 就代表使用者直接貼 GZIP wire data。
     */
    return raw;
  }
  /* ============================================================
 * GZIP extraction / decompression
 *
 * 支援：
 *
 * 1. 完整 GZIP
 * 2. HTTP chunked + GZIP
 * 3. GZIP trailer 不完整，但 DEFLATE 資料仍完整
 *
 * 第 3 種就是：
 *
 * [0x1f][0x8b][0x08]...
 *
 * 尾端少 1~N bytes，但中間的 DEFLATE
 * 仍然可以正常解壓。
 * ============================================================ */
  function extractGzipFromBytes(bytes) {
    const gzipStart = findGzipStart(bytes);
    if (gzipStart === -1) {
      throw new Error(
              '找不到 GZIP header：[0x1f][0x8b]'
      );
    }
    const gzipBytes = bytes.slice(gzipStart);
    /*
     * ----------------------------------------------------------
     * 1. 先嘗試標準 GZIP
     * ----------------------------------------------------------
     *
     * 這是最正常的情況。
     */
    try {
      const decompressed = pako.ungzip(gzipBytes);
      return {
        gzip: gzipBytes,
        decompressed: decompressed,
        truncated: false
      };
    } catch (gzipError) {
      /*
       * 標準 GZIP 失敗。
       *
       * 不要立刻判定資料無效。
       *
       * 有些 Apache / wire log 在複製、截取、
       * log truncation 後，可能只剩：
       *
       * GZIP header
       * +
       * 完整 DEFLATE
       * +
       * 不完整 trailer
       *
       * 這種情況 raw DEFLATE 還是可以解出內容。
       */
    }
    /*
     * ----------------------------------------------------------
     * 2. HTTP chunked fallback
     * ----------------------------------------------------------
     */
    let chunkHeaderStart = -1;
    for (
            let i = 0;
            i < gzipStart;
            i++
    ) {
      if (bytes[i] !== 0x0a) {
        continue;
      }
      let lineStart = i - 1;
      while (
              lineStart >= 0 &&
              bytes[lineStart] !== 0x0a
              ) {
        lineStart--;
      }
      lineStart++;
      const line =
              new TextDecoder()
                      .decode(
                              bytes.slice(lineStart, i)
                      )
                      .replace(/\r/g, '')
                      .trim();
      if (
              /^[0-9a-fA-F]+$/.test(line)
      ) {
        const size =
                parseInt(line, 16);
        const payloadStart =
                i + 1;
        if (
                payloadStart <= gzipStart &&
                gzipStart < payloadStart + size
        ) {
          chunkHeaderStart =
                  lineStart;
          break;
        }
      }
    }
    if (chunkHeaderStart !== -1) {
      let pos = chunkHeaderStart;
      const chunkBytes = [];
      while (pos < bytes.length) {
        let lineEnd = pos;
        while (
                lineEnd < bytes.length &&
                bytes[lineEnd] !== 0x0a
                ) {
          lineEnd++;
        }
        if (
                lineEnd >= bytes.length
        ) {
          break;
        }
        let sizeText =
                new TextDecoder()
                        .decode(
                                bytes.slice(pos, lineEnd)
                        )
                        .replace(/\r/g, '')
                        .trim();
        /*
         * 支援 chunk extension
         *
         * 例如：
         *
         * 31;foo=bar
         */
        sizeText =
                sizeText.split(';')[0];
        if (
                !/^[0-9a-fA-F]+$/.test(sizeText)
        ) {
          break;
        }
        const size =
                parseInt(sizeText, 16);
        /*
         * chunked 結束
         */
        if (size === 0) {
          break;
        }
        const dataStart =
                lineEnd + 1;
        const dataEnd =
                dataStart + size;
        if (
                dataEnd > bytes.length
        ) {
          throw new Error(
                  'HTTP chunk 資料不完整。'
          );
        }
        for (
                let i = dataStart;
                i < dataEnd;
                i++
        ) {
          chunkBytes.push(
                  bytes[i]
          );
        }
        /*
         * skip CRLF
         */
        pos = dataEnd;
        if (
                bytes[pos] === 0x0d &&
                bytes[pos + 1] === 0x0a
        ) {
          pos += 2;
        } else if (
                bytes[pos] === 0x0a
        ) {
          pos += 1;
        }
      }
      const chunkedGzip =
              new Uint8Array(chunkBytes);
      if (
              chunkedGzip.length >= 2 &&
              chunkedGzip[0] === 0x1f &&
              chunkedGzip[1] === 0x8b
      ) {
        /*
         * 先嘗試正常 GZIP
         */
        try {
          const decompressed =
                  pako.ungzip(chunkedGzip);
          return {
            gzip: chunkedGzip,
            decompressed: decompressed,
            truncated: false
          };
        } catch (e) {
          /*
           * chunked GZIP 也可能有不完整 trailer，
           * 往下面的 raw DEFLATE fallback。
           */
        }
        /*
         * ------------------------------------------------------
         * 3. chunked + truncated GZIP
         * ------------------------------------------------------
         */
        if (chunkedGzip.length >= 11) {
          try {
            const rawDeflate =
                    chunkedGzip.slice(10);
            const decompressed =
                    pako.inflateRaw(rawDeflate);
            return {
              gzip: chunkedGzip,
              decompressed: decompressed,
              truncated: true
            };
          } catch (e) {
            /*
             * 繼續往下報錯
             */
          }
        }
      }
    }
    /*
     * ----------------------------------------------------------
     * 4. Truncated GZIP fallback
     * ----------------------------------------------------------
     *
     * GZIP header：
     *
     * 1F 8B 08
     *
     * 固定 header 最少 10 bytes。
     *
     * 第 10 byte 之後就是 DEFLATE。
     *
     * pako.inflateRaw() 不需要 GZIP trailer，
     * 所以即使 CRC32 / ISIZE 不完整，
     * 只要 DEFLATE stream 完整，仍然可以解壓。
     */
    if (
            gzipBytes.length >= 11 &&
            gzipBytes[0] === 0x1f &&
            gzipBytes[1] === 0x8b &&
            gzipBytes[2] === 0x08
    ) {
      try {
        /*
         * GZIP header 基本上是 10 bytes。
         *
         * 目前支援的 Apache wire data
         * 都可以從 offset 10 開始找 DEFLATE。
         */
        const rawDeflate =
                gzipBytes.slice(10);
        const decompressed =
                pako.inflateRaw(rawDeflate);
        return {
          gzip: gzipBytes,
          decompressed: decompressed,
          truncated: true
        };
      } catch (rawError) {
        throw new Error(
                'GZIP 解壓失敗。\n' +
                '標準 GZIP 與截斷 GZIP 的 DEFLATE 都無法解壓。'
        );
      }
    }
    throw new Error(
            '不是有效的完整 GZIP，也找不到 HTTP chunk framing。'
    );
  }
  /* ============================================================
   * UTF-8
   * ============================================================ */
  function decodeUtf8(bytes) {
    return new TextDecoder(
            'utf-8',
            {
              fatal: false
            }
    ).decode(bytes);
  }
  /* ============================================================
   * JSON pretty print
   * ============================================================ */
  function tryFormatJson(text) {
    const value =
            text.trim();
    if (!value) {
      return {
        isJson: false,
        text: ''
      };
    }
    try {
      const json =
              JSON.parse(value);
      return {
        isJson: true,
        text: JSON.stringify(
                json,
                null,
                2
        )
      };
    } catch (e) {
      return {
        isJson: false,
        text: text
      };
    }
  }
  /* ============================================================
   * Main
   * ============================================================ */
  document
          .getElementById('decompress')
          .addEventListener(
                  'click',
                  function () {
                    const raw =
                            document
                                    .getElementById('input')
                                    .value;
                    const output =
                            document
                                    .getElementById('output');
                    const status =
                            document
                                    .getElementById('status');
                    output.textContent = '';
                    if (!raw.trim()) {
                      status.textContent =
                              '請先貼上資料。';
                      status.className =
                              'status error';
                      return;
                    }
                    try {
                      /*
                       * 1.
                       *
                       * 如果是 Apache log：
                       *
                       * << "..."
                       *
                       * 取出 quote 內容。
                       *
                       * 如果是純 GZIP：
                       * 原樣使用。
                       */
                      const wireText =
                              extractApacheWireText(raw);
                      /*
                       * 2. wire → bytes
                       */
                      const bytes =
                              parseWireBytes(wireText);
                      /*
                       * 3. GZIP
                       */
                      const gzipResult =
                              extractGzipFromBytes(bytes);
                      const gzipData =
                              gzipResult.gzip;
                      /*
                       * 4. ungzip
                       */
                      const decompressed =
                              gzipResult.decompressed;
                      /*
                       * 5. UTF-8
                       */
                      const text =
                              decodeUtf8(decompressed);
                      /*
                       * 6. JSON
                       */
                      const result =
                              tryFormatJson(text);
                      output.textContent =
                              result.text;
                      if (result.isJson) {
                        status.textContent =
                                '✓ GZIP 解壓成功\n' +
                                '✓ JSON 格式化成功\n' +
                                (
                                        gzipResult.truncated
                                                ? '⚠ GZIP trailer 不完整，已使用 DEFLATE fallback\n'
                                                : ''
                                ) +
                                'GZIP bytes: ' +
                                gzipData.length +
                                '\n' +
                                '解壓後 bytes: ' +
                                decompressed.length;
                      } else {
                        status.textContent =
                                '✓ GZIP 解壓成功\n' +
                                (
                                        gzipResult.truncated
                                                ? '⚠ GZIP trailer 不完整，已使用 DEFLATE fallback\n'
                                                : ''
                                ) +
                                '⚠ 解壓後內容不是 JSON\n' +
                                'GZIP bytes: ' +
                                gzipData.length +
                                '\n' +
                                '解壓後 bytes: ' +
                                decompressed.length;
                      }
                      status.className =
                              'status success';
                    } catch (e) {
                      console.error(e);
                      status.textContent =
                              '✗ 解壓失敗\n' +
                              e.message;
                      output.textContent =
                              '解壓失敗：\n\n' +
                              e.message;
                      status.className =
                              'status error';
                    }
                  }
          );
  /* ============================================================
   * Copy
   * ============================================================ */
  document
          .getElementById('copy')
          .addEventListener(
                  'click',
                  async function () {
                    const text =
                            document
                                    .getElementById('output')
                                    .textContent;
                    if (!text) {
                      return;
                    }
                    try {
                      await navigator.clipboard.writeText(text);
                      document
                              .getElementById('status')
                              .textContent =
                              '✓ 已複製結果';
                    } catch (e) {
                      alert(
                              '無法自動複製，請手動複製結果。'
                      );
                    }
                  }
          );
  /* ============================================================
   * Clear
   * ============================================================ */
  document
          .getElementById('clear')
          .addEventListener(
                  'click',
                  function () {
                    document
                            .getElementById('input')
                            .value = '';
                    document
                            .getElementById('output')
                            .textContent = '';
                    const status =
                            document
                                    .getElementById('status');
                    status.textContent =
                            '尚未處理資料';
                    status.className =
                            'status';
                  }
          );
</script>
</body>
</html>
