<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PancakeSwap V3 LP 平衡計算器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Arial,
                    sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 5px;
        }
        h2 {
            margin-top: 0;
        }
        h3 {
            margin-top: 0;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
        }
        input,
        select,
        button {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #1f2937;
            font-size: 15px;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #5c8cff;
        }
        button {
            margin-top: 15px;
            cursor: pointer;
            background: #356dff;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background: #2858d8;
        }
        button.secondary {
            background: #252f45;
        }
        button.green-btn {
            background: #168a57;
        }
        button.green-btn:hover {
            background: #116c44;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .token-row {
            display: grid;
            grid-template-columns: 1fr 150px;
            gap: 10px;
            align-items: end;
        }
        .price-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .price {
            font-size: 19px;
            font-weight: bold;
        }
        .small {
            font-size: 12px;
            color: #64748b;
        }
        .info {
            color: #8d99ae;
            font-size: 13px;
            line-height: 1.7;
        }
        .result {
            line-height: 1.7;
        }
        .result-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
        }
        .green {
            color: #35d07f;
        }
        .red {
            color: #ff6874;
        }
        .yellow {
            color: #ffc857;
        }
        .blue {
            color: #67a1ff;
        }
        .big {
            font-size: 21px;
            font-weight: bold;
        }
        .huge {
            font-size: 26px;
            font-weight: bold;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 15px 0;
        }
        .badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #475569;
            font-size: 12px;
        }
        .loading {
            color: #ffc857;
        }
        .error {
            color: #ff6874;
        }
        .warning {
            background: rgba(255, 200, 87, 0.08);
            border: 1px solid rgba(255, 200, 87, 0.25);
            border-radius: 8px;
            padding: 12px;
            color: #ffc857;
            margin-top: 10px;
        }
        .success {
            background: rgba(53, 208, 127, 0.08);
            border: 1px solid rgba(53, 208, 127, 0.25);
            border-radius: 8px;
            padding: 12px;
            color: #35d07f;
            margin-top: 10px;
        }
        .danger {
            background: rgba(255, 104, 116, 0.08);
            border: 1px solid rgba(255, 104, 116, 0.25);
            border-radius: 8px;
            padding: 12px;
            color: #ff6874;
            margin-top: 10px;
        }
        .swap-direction {
            text-align: center;
            font-size: 18px;
            padding: 10px 0;
        }
        .formula {
            background: #090d15;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            color: #b9c2d0;
            overflow-x: auto;
        }
        @media(max-width:600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .token-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🥞 PancakeSwap V3 LP 平衡計算器</h1>
    <div class="subtitle">
        Concentrated Liquidity / V3 精確配比
    </div>
    <!-- =====================================================
         NETWORK
    ====================================================== -->
    <div class="card">
        <h3>① Blockchain</h3>
        <select id="network">
            <option value="monad">
                Monad
            </option>
            <option value="ethereum">
                Ethereum
            </option>
            <option value="base">
                Base
            </option>
            <option value="arbitrum">
                Arbitrum
            </option>
            <option value="bsc">
                BNB Chain
            </option>
            <option value="optimism">
                Optimism
            </option>
            <option value="polygon">
                Polygon
            </option>
        </select>
    </div>
    <!-- =====================================================
         TOKEN
    ====================================================== -->
    <div class="card">
        <h3>② Token</h3>
        <div class="token-row">
            <div>
                <label>
                    Token A
                </label>
                <input
                        id="tokenASearch"
                        value="WMON"
                        placeholder="例如 WMON"
                >
                <select id="tokenA"></select>
            </div>
            <div>
                <label>
                    Token A USD 價格
                </label>
                <input
                        id="priceA"
                        type="number"
                        step="any"
                        placeholder="例如 1"
                >
            </div>
        </div>
        <div class="token-row">
            <div>
                <label>
                    Token B
                </label>
                <input
                        id="tokenBSearch"
                        value="USDC"
                        placeholder="例如 USDC"
                >
                <select id="tokenB"></select>
            </div>
            <div>
                <label>
                    Token B USD 價格
                </label>
                <input
                        id="priceB"
                        type="number"
                        step="any"
                        placeholder="例如 1"
                >
            </div>
        </div>
        <button
                class="secondary"
                onclick="loadPrices()"
        >
            🔄 取得市場價格
        </button>
        <div class="price-box">
            <div class="small">
                PancakeSwap V3 計算價格
            </div>
            <div
                    class="price"
                    id="pairPrice"
            >
                -
            </div>
            <div class="small">
                Token B / Token A
            </div>
        </div>
    </div>
    <!-- =====================================================
         CURRENT ASSETS
    ====================================================== -->
    <div class="card">
        <h3>③ 目前手上的資產</h3>
        <div class="grid">
            <div>
                <label>
                    Token A 數量
                </label>
                <input
                        id="amountA"
                        type="number"
                        step="any"
                        placeholder="例如 16896.1"
                >
            </div>
            <div>
                <label>
                    Token B 數量
                </label>
                <input
                        id="amountB"
                        type="number"
                        step="any"
                        placeholder="例如 585.63061549"
                >
            </div>
        </div>
    </div>
    <!-- =====================================================
         RANGE
    ====================================================== -->
    <div class="card">
        <h3>④ PancakeSwap V3 LP Range</h3>
        <label>
            最低價格
            <br>
            <span class="small">
                Token B per Token A
            </span>
        </label>
        <input
                id="minPrice"
                type="number"
                step="any"
                placeholder="例如 0.025"
        >
        <label>
            最高價格
            <br>
            <span class="small">
                Token B per Token A
            </span>
        </label>
        <input
                id="maxPrice"
                type="number"
                step="any"
                placeholder="例如 0.05"
        >
        <label>
            目前價格
            <br>
            <span class="small">
                Token B per Token A
            </span>
        </label>
        <input
                id="currentPrice"
                type="number"
                step="any"
                placeholder="自動使用市場價格"
        >
        <button
                class="secondary"
                onclick="useMarketPrice()"
        >
            📈 使用目前市場價格
        </button>
    </div>
    <!-- =====================================================
         SWAP SETTINGS
    ====================================================== -->
    <div class="card">
        <h3>⑤ Swap 設定</h3>
        <div class="grid">
            <div>
                <label>
                    Swap Fee %
                </label>
                <input
                        id="swapFee"
                        type="number"
                        step="any"
                        value="0"
                        placeholder="例如 0.25"
                >
            </div>
            <div>
                <label>
                    預估滑點 %
                </label>
                <input
                        id="slippage"
                        type="number"
                        step="any"
                        value="0"
                        placeholder="例如 0.5"
                >
            </div>
        </div>
        <div class="info">
            計算器預設使用「無 Fee、無滑點」的理論結果。
            <br>
            如果你要實際 Swap，可以輸入預估 Fee / Slippage，
            讓建議賣出量更保守。
        </div>
    </div>
    <!-- =====================================================
         CALCULATE
    ====================================================== -->
    <div class="card">
        <button
                class="green-btn"
                onclick="calculate()"
        >
            🧮 計算「到底要賣哪個幣」
        </button>
        <div
                id="result"
                class="result"
        ></div>
    </div>
</div>
<script>
    /* =========================================================
       CONFIG
    ========================================================= */
    const API_BASE =
        "https://api.dexscreener.com/latest/dex";
    const NETWORKS = {
        monad: {
            name: "Monad",
            dexChain: "monad"
        },
        ethereum: {
            name: "Ethereum",
            dexChain: "ethereum"
        },
        base: {
            name: "Base",
            dexChain: "base"
        },
        arbitrum: {
            name: "Arbitrum",
            dexChain: "arbitrum"
        },
        bsc: {
            name: "BNB Chain",
            dexChain: "bsc"
        },
        optimism: {
            name: "Optimism",
            dexChain: "optimism"
        },
        polygon: {
            name: "Polygon",
            dexChain: "polygon"
        }
    };
    /* =========================================================
       TOKEN SEARCH
    ========================================================= */
    let searchTimers = {
        A: null,
        B: null
    };
    function setupSearch(side) {
        const input =
            document.getElementById(
                side === "A"
                    ? "tokenASearch"
                    : "tokenBSearch"
            );
        input.addEventListener(
            "input",
            () => {
                clearTimeout(
                    searchTimers[side]
                );
                searchTimers[side] =
                    setTimeout(
                        () => searchToken(side),
                        500
                    );
            }
        );
    }
    async function searchToken(side) {
        const input =
            document.getElementById(
                side === "A"
                    ? "tokenASearch"
                    : "tokenBSearch"
            );
        const query =
            input.value.trim();
        if (!query)
            return;
        try {
            const response =
                await fetch(
                    `${API_BASE}/search/?q=${encodeURIComponent(query)}`
                );
            const data =
                await response.json();
            let pairs =
                data.pairs || [];
            const network =
                document.getElementById(
                    "network"
                ).value;
            const chain =
                NETWORKS[
                    network
                    ].dexChain;
            const chainPairs =
                pairs.filter(
                    p =>
                        p.chainId === chain
                );
            if (chainPairs.length) {
                pairs =
                    chainPairs;
            }
            const map =
                new Map();
            pairs.forEach(
                p => {
                    if (!p.baseToken)
                        return;
                    const address =
                        p.baseToken.address;
                    if (!map.has(address)) {
                        map.set(
                            address,
                            {
                                address,
                                symbol:
                                p.baseToken.symbol,
                                name:
                                p.baseToken.name,
                                priceUsd:
                                p.priceUsd,
                                pair:
                                p.pairAddress
                            }
                        );
                    }
                }
            );
            const tokens =
                [...map.values()];
            const select =
                document.getElementById(
                    side === "A"
                        ? "tokenA"
                        : "tokenB"
                );
            select.innerHTML =
                "";
            tokens
                .slice(0, 30)
                .forEach(
                    token => {
                        const option =
                            document.createElement(
                                "option"
                            );
                        option.value =
                            JSON.stringify(
                                token
                            );
                        option.textContent =
                            `${token.symbol} — ${token.name || ""}`;
                        select.appendChild(
                            option
                        );
                    }
                );
            if (tokens.length) {
                select.selectedIndex = 0;
                updateTokenPrice(side);
            }
        }
        catch (error) {
            console.error(
                error
            );
        }
    }
    /* =========================================================
       IMMEDIATE TOKEN SEARCH
    ========================================================= */
    async function searchTokenImmediate(
        side,
        query
    ) {
        try {
            const response =
                await fetch(
                    `${API_BASE}/search/?q=${encodeURIComponent(query)}`
                );
            const data =
                await response.json();
            let pairs =
                data.pairs || [];
            const network =
                document.getElementById(
                    "network"
                ).value;
            const chain =
                NETWORKS[
                    network
                    ].dexChain;
            const chainPairs =
                pairs.filter(
                    p =>
                        p.chainId === chain
                );
            if (chainPairs.length) {
                pairs =
                    chainPairs;
            }
            if (!pairs.length)
                return;
            const p =
                pairs[0];
            if (!p.baseToken)
                return;
            const token = {
                address:
                p.baseToken.address,
                symbol:
                p.baseToken.symbol,
                name:
                p.baseToken.name,
                priceUsd:
                p.priceUsd,
                pair:
                p.pairAddress
            };
            const select =
                document.getElementById(
                    side === "A"
                        ? "tokenA"
                        : "tokenB"
                );
            select.innerHTML =
                "";
            const option =
                document.createElement(
                    "option"
                );
            option.value =
                JSON.stringify(
                    token
                );
            option.textContent =
                `${token.symbol} — ${token.name || ""}`;
            select.appendChild(
                option
            );
            select.value =
                option.value;
            if (token.priceUsd) {
                document.getElementById(
                    side === "A"
                        ? "priceA"
                        : "priceB"
                ).value =
                    token.priceUsd;
            }
        }
        catch (error) {
            console.error(
                error
            );
        }
    }
    /* =========================================================
       TOKEN SELECT
    ========================================================= */
    document
        .getElementById("tokenA")
        .addEventListener(
            "change",
            () => updateTokenPrice("A")
        );
    document
        .getElementById("tokenB")
        .addEventListener(
            "change",
            () => updateTokenPrice("B")
        );
    function updateTokenPrice(side) {
        const select =
            document.getElementById(
                side === "A"
                    ? "tokenA"
                    : "tokenB"
            );
        if (!select.value)
            return;
        try {
            const token =
                JSON.parse(
                    select.value
                );
            if (token.priceUsd) {
                document.getElementById(
                    side === "A"
                        ? "priceA"
                        : "priceB"
                ).value =
                    token.priceUsd;
            }
        }
        catch (error) {}
        updatePairPrice();
    }
    /* =========================================================
       PRICE
    ========================================================= */
    function getMarketPrice() {
        const priceA =
            parseFloat(
                document.getElementById(
                    "priceA"
                ).value
            );
        const priceB =
            parseFloat(
                document.getElementById(
                    "priceB"
                ).value
            );
        if (
            !Number.isFinite(priceA) ||
            !Number.isFinite(priceB) ||
            priceA <= 0 ||
            priceB <= 0
        ) {
            return null;
        }
        return priceA / priceB;
    }
    function updatePairPrice() {
        const price =
            getMarketPrice();
        if (
            !Number.isFinite(price)
        ) {
            document.getElementById(
                "pairPrice"
            ).textContent =
                "-";
            return;
        }
        document.getElementById(
            "pairPrice"
        ).textContent =
            formatNumber(
                price,
                12
            );
    }
    function useMarketPrice() {
        const price =
            getMarketPrice();
        if (!price) {
            alert(
                "請先取得 Token A / Token B 價格"
            );
            return;
        }
        document.getElementById(
            "currentPrice"
        ).value =
            price;
        updatePairPrice();
    }
    /* =========================================================
       LOAD PRICES
    ========================================================= */
    async function loadPrices() {
        const tokenA =
            document.getElementById(
                "tokenASearch"
            ).value.trim();
        const tokenB =
            document.getElementById(
                "tokenBSearch"
            ).value.trim();
        if (
            !tokenA ||
            !tokenB
        ) {
            alert(
                "請輸入 Token"
            );
            return;
        }
        document.getElementById(
            "result"
        ).innerHTML = `
        <div class="loading">
            ⏳ 正在取得市場價格...
        </div>
    `;
        await Promise.all([
            searchTokenImmediate(
                "A",
                tokenA
            ),
            searchTokenImmediate(
                "B",
                tokenB
            )
        ]);
        updatePairPrice();
        const marketPrice =
            getMarketPrice();
        if (marketPrice) {
            document.getElementById(
                "currentPrice"
            ).value =
                marketPrice;
        }
        document.getElementById(
            "result"
        ).innerHTML =
            "";
    }
    /* =========================================================
       FORMAT
    ========================================================= */
    function formatNumber(
        value,
        decimals = 12
    ) {
        if (
            !Number.isFinite(value)
        )
            return "0";
        return value.toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits:
                decimals
            }
        );
    }
    /* =========================================================
       SYMBOL
    ========================================================= */
    function getSymbol(side) {
        try {
            const select =
                document.getElementById(
                    side === "A"
                        ? "tokenA"
                        : "tokenB"
                );
            if (select.value) {
                const token =
                    JSON.parse(
                        select.value
                    );
                return token.symbol;
            }
        }
        catch (error) {}
        return side === "A"
            ? "Token A"
            : "Token B";
    }
    /* =========================================================
   PANCAKESWAP V3 / CL LP MATH
========================================================= */
    /*
     * PancakeSwap V3 / CL 的核心：
     *
     * price = Token B / Token A
     *
     * sqrtPrice = sqrt(price)
     *
     * 在 range 內：
     *
     * amountA = L * (1/sqrtP - 1/sqrtUpper)
     * amountB = L * (sqrtP - sqrtLower)
     *
     * 但「建池需要多少」不能直接拿總資產
     * 除以某個比例後就結束。
     *
     * 正確方式：
     *
     * 1. 先用現有總資產價值決定最大可用 liquidity
     * 2. 用 amountA / amountB 算出目前資產能提供的 liquidity
     * 3. 哪一邊 liquidity 是瓶頸，就以那一邊為基準
     * 4. 判斷另一邊多出多少
     * 5. 只賣掉多出的 token
     *
     * 這樣總資產價值不會被重新創造。
     */
    /* ---------------------------------------------------------
       sqrt price
    --------------------------------------------------------- */
    function sqrtPrice(price) {
        return Math.sqrt(price);
    }
    /* ---------------------------------------------------------
       Amount0 per liquidity
    --------------------------------------------------------- */
    function amount0PerLiquidity(
        sqrtP,
        sqrtLower,
        sqrtUpper
    ) {
        /*
         * current <= lower
         *
         * position is 100% token0
         */
        if (sqrtP <= sqrtLower) {
            return (
                1 / sqrtLower -
                1 / sqrtUpper
            );
        }
        /*
         * current >= upper
         *
         * position is 0 token0
         */
        if (sqrtP >= sqrtUpper) {
            return 0;
        }
        /*
         * current inside range
         */
        return (
            1 / sqrtP -
            1 / sqrtUpper
        );
    }
    /* ---------------------------------------------------------
       Amount1 per liquidity
    --------------------------------------------------------- */
    function amount1PerLiquidity(
        sqrtP,
        sqrtLower,
        sqrtUpper
    ) {
        /*
         * current <= lower
         *
         * position is 0 token1
         */
        if (sqrtP <= sqrtLower) {
            return 0;
        }
        /*
         * current >= upper
         *
         * position is 100% token1
         */
        if (sqrtP >= sqrtUpper) {
            return (
                sqrtUpper -
                sqrtLower
            );
        }
        /*
         * current inside range
         */
        return (
            sqrtP -
            sqrtLower
        );
    }
    /* =========================================================
       CALCULATE V3 POSITION FROM TOTAL VALUE
    ========================================================= */
    function calculateLPComposition(
        lower,
        upper,
        current,
        totalValue,
        priceA,
        priceB
    ) {
        const sqrtL =
            Math.sqrt(lower);
        const sqrtU =
            Math.sqrt(upper);
        const sqrtP =
            Math.sqrt(current);
        /*
         * -----------------------------------------------------
         * PRICE BELOW RANGE
         * -----------------------------------------------------
         *
         * PancakeSwap V3 position:
         *
         * 100% Token A
         */
        if (current <= lower) {
            return {
                mode: "A",
                amountA:
                    totalValue / priceA,
                amountB: 0,
                ratioA: 1,
                ratioB: 0,
                liquidity:
                    (
                        totalValue / priceA
                    ) /
                    (
                        1 / sqrtL -
                        1 / sqrtU
                    )
            };
        }
        /*
         * -----------------------------------------------------
         * PRICE ABOVE RANGE
         * -----------------------------------------------------
         *
         * PancakeSwap V3 position:
         *
         * 100% Token B
         */
        if (current >= upper) {
            return {
                mode: "B",
                amountA: 0,
                amountB:
                    totalValue / priceB,
                ratioA: 0,
                ratioB: 1,
                liquidity:
                    (
                        totalValue / priceB
                    ) /
                    (
                        sqrtU -
                        sqrtL
                    )
            };
        }
        /*
         * -----------------------------------------------------
         * PRICE INSIDE RANGE
         * -----------------------------------------------------
         */
        const unitA =
            amount0PerLiquidity(
                sqrtP,
                sqrtL,
                sqrtU
            );
        const unitB =
            amount1PerLiquidity(
                sqrtP,
                sqrtL,
                sqrtU
            );
        /*
         * value of 1 liquidity
         *
         * A value:
         *
         * unitA * priceA
         *
         * B value:
         *
         * unitB * priceB
         */
        const unitValue =
            unitA * priceA +
            unitB * priceB;
        if (
            !Number.isFinite(unitValue) ||
            unitValue <= 0
        ) {
            throw new Error(
                "V3 LP liquidity 計算失敗"
            );
        }
        /*
         * Total value fixed.
         *
         * This is extremely important.
         *
         * We are NOT changing totalValue.
         */
        const L =
            totalValue / unitValue;
        const amountA =
            unitA * L;
        const amountB =
            unitB * L;
        const valueA =
            amountA * priceA;
        const valueB =
            amountB * priceB;
        return {
            mode: "both",
            amountA,
            amountB,
            ratioA:
                valueA / totalValue,
            ratioB:
                valueB / totalValue,
            liquidity: L
        };
    }
    /* =========================================================
       CALCULATE HOW MUCH TOKEN TO SELL
    ========================================================= */
    /*
     * 核心概念：
     *
     * 現有資產：
     *
     * currentA
     * currentB
     *
     * LP 需要：
     *
     * targetA
     * targetB
     *
     * 總價值固定。
     *
     * 所以：
     *
     * currentA * priceA
     * +
     * currentB * priceB
     *
     * =
     *
     * targetA * priceA
     * +
     * targetB * priceB
     *
     *
     * 只需要判斷哪邊多。
     */
    function calculateRequiredSwap(
        currentA,
        currentB,
        targetA,
        targetB,
        priceA,
        priceB
    ) {
        /*
         * tolerance
         *
         * 避免浮點數造成：
         *
         * 0.00000000001
         *
         * 被判斷成需要 swap
         */
        const tolerance =
            Math.max(
                1e-12,
                (
                    Math.abs(currentA) +
                    Math.abs(targetA)
                ) * 1e-10
            );
        /*
         * -----------------------------------------------------
         * Case 1
         *
         * A 太多
         * B 太少
         *
         * SELL A
         * BUY B
         * -----------------------------------------------------
         */
        if (
            currentA >
            targetA + tolerance
        ) {
            const sellA =
                currentA - targetA;
            const sellValue =
                sellA * priceA;
            const buyB =
                sellValue / priceB;
            return {
                action: "SELL_A",
                sellA,
                receiveB: buyB,
                sellB: 0,
                receiveA: 0,
                finalA:
                    currentA - sellA,
                finalB:
                    currentB + buyB
            };
        }
        /*
         * -----------------------------------------------------
         * Case 2
         *
         * B 太多
         * A 太少
         *
         * SELL B
         * BUY A
         * -----------------------------------------------------
         */
        if (
            currentB >
            targetB + tolerance
        ) {
            const sellB =
                currentB - targetB;
            const sellValue =
                sellB * priceB;
            const buyA =
                sellValue / priceA;
            return {
                action: "SELL_B",
                sellA: 0,
                receiveB: 0,
                sellB,
                receiveA: buyA,
                finalA:
                    currentA + buyA,
                finalB:
                    currentB - sellB
            };
        }
        /*
         * -----------------------------------------------------
         * Already balanced
         * -----------------------------------------------------
         */
        return {
            action: "NONE",
            sellA: 0,
            receiveB: 0,
            sellB: 0,
            receiveA: 0,
            finalA: currentA,
            finalB: currentB
        };
    }
    /* =========================================================
       MAIN CALCULATION
    ========================================================= */
    function calculate() {
        const amountA =
            parseFloat(
                document.getElementById(
                    "amountA"
                ).value
            );
        const amountB =
            parseFloat(
                document.getElementById(
                    "amountB"
                ).value
            );
        const priceA =
            parseFloat(
                document.getElementById(
                    "priceA"
                ).value
            );
        const priceB =
            parseFloat(
                document.getElementById(
                    "priceB"
                ).value
            );
        const lower =
            parseFloat(
                document.getElementById(
                    "minPrice"
                ).value
            );
        const upper =
            parseFloat(
                document.getElementById(
                    "maxPrice"
                ).value
            );
        let current =
            parseFloat(
                document.getElementById(
                    "currentPrice"
                ).value
            );
        /*
         * -----------------------------------------------------
         * Validation
         * -----------------------------------------------------
         */
        if (
            !Number.isFinite(amountA) ||
            !Number.isFinite(amountB) ||
            !Number.isFinite(priceA) ||
            !Number.isFinite(priceB) ||
            !Number.isFinite(lower) ||
            !Number.isFinite(upper)
        ) {
            alert(
                "請完整輸入 Token 數量、價格與 LP 區間"
            );
            return;
        }
        if (
            amountA < 0 ||
            amountB < 0 ||
            priceA <= 0 ||
            priceB <= 0 ||
            lower <= 0 ||
            upper <= 0
        ) {
            alert(
                "數值必須大於 0"
            );
            return;
        }
        if (lower >= upper) {
            alert(
                "最低價格必須小於最高價格"
            );
            return;
        }
        /*
         * -----------------------------------------------------
         * Current market price
         * -----------------------------------------------------
         */
        if (
            !Number.isFinite(current) ||
            current <= 0
        ) {
            current =
                priceA / priceB;
            document.getElementById(
                "currentPrice"
            ).value =
                current;
        }
        /*
         * -----------------------------------------------------
         * IMPORTANT
         *
         * Current price 必須與 token USD price 一致。
         *
         * Token B per Token A
         *
         * = priceA / priceB
         * -----------------------------------------------------
         */
        const marketPrice =
            priceA / priceB;
        /*
         * 不強制覆蓋使用者輸入的 current。
         *
         * 因為使用者可能在測試：
         *
         * 「如果價格在 X 的時候建池」
         *
         * 但是顯示一個提醒。
         */
        const priceDifference =
            Math.abs(
                current - marketPrice
            ) / marketPrice;
        /*
         * -----------------------------------------------------
         * Total asset value
         *
         * THIS NEVER CHANGES.
         * -----------------------------------------------------
         */
        const valueA =
            amountA * priceA;
        const valueB =
            amountB * priceB;
        const total =
            valueA + valueB;
        /*
         * -----------------------------------------------------
         * PancakeSwap V3 LP target composition
         * -----------------------------------------------------
         */
        let lp;
        try {
            lp =
                calculateLPComposition(
                    lower,
                    upper,
                    current,
                    total,
                    priceA,
                    priceB
                );
        } catch (e) {
            document.getElementById(
                "result"
            ).innerHTML =
                `<div class="error">
                ${e.message}
            </div>`;
            return;
        }
        /*
         * -----------------------------------------------------
         * Determine which token should be sold
         * -----------------------------------------------------
         */
        const swap =
            calculateRequiredSwap(
                amountA,
                amountB,
                lp.amountA,
                lp.amountB,
                priceA,
                priceB
            );
        /*
         * -----------------------------------------------------
         * Final assets
         *
         * These are NOT a new total.
         *
         * They are simply:
         *
         * existing assets
         * +/- swap
         * -----------------------------------------------------
         */
        const finalA =
            swap.finalA;
        const finalB =
            swap.finalB;
        /*
         * -----------------------------------------------------
         * Value check
         * -----------------------------------------------------
         */
        const finalValue =
            finalA * priceA +
            finalB * priceB;
        const valueError =
            finalValue - total;
        /*
         * -----------------------------------------------------
         * Token symbols
         * -----------------------------------------------------
         */
        const symbolA =
            getSymbol("A");
        const symbolB =
            getSymbol("B");
        let html = "";
        /* =====================================================
           ASSET SUMMARY
        ===================================================== */
        html += `
    <div class="result-box">
        <span class="badge">
            資產總覽
        </span>
        <hr>
        ${symbolA}
        <b>
            ${formatNumber(
            amountA,
            12
        )}
        </b>
        <br>
        價值：
        ${formatNumber(
            valueA,
            2
        )}
        USDT
        <hr>
        ${symbolB}
        <b>
            ${formatNumber(
            amountB,
            12
        )}
        </b>
        <br>
        價值：
        ${formatNumber(
            valueB,
            2
        )}
        USDT
        <hr>
        <span class="big">
            總資產：
            ${formatNumber(
            total,
            2
        )}
            USDT
        </span>
    </div>
    `;
        /* =====================================================
           CURRENT STATUS
        ===================================================== */
        html += `
    <div class="result-box">
        <span class="badge">
            LP 狀態
        </span>
        <hr>
        目前價格：
        <b>
            ${formatNumber(
            current,
            12
        )}
        </b>
        ${symbolB} / ${symbolA}
        <br>
        LP Range：
        <b>
            ${formatNumber(
            lower,
            12
        )}
        </b>
        ~
        <b>
            ${formatNumber(
            upper,
            12
        )}
        </b>
    `;
        if (current < lower) {
            html += `
        <hr>
        <span class="yellow">
            📉 目前價格低於 LP 區間
        </span>
        <br>
        V3 LP 將為：
        <b>
            100% ${symbolA}
        </b>
        `;
        } else if (current > upper) {
            html += `
        <hr>
        <span class="yellow">
            📈 目前價格高於 LP 區間
        </span>
        <br>
        V3 LP 將為：
        <b>
            100% ${symbolB}
        </b>
        `;
        } else {
            html += `
        <hr>
        <span class="green">
            🟢 目前價格在 LP 區間內
        </span>
        `;
        }
        /*
         * current price vs market price
         */
        if (
            priceDifference > 0.001
        ) {
            html += `
        <hr>
        <span class="yellow">
            ⚠️ 目前價格與 Token USD
            推算價格不同
        </span>
        <br>
        Token USD 推算：
        <b>
            ${formatNumber(
                marketPrice,
                12
            )}
        </b>
        ${symbolB} / ${symbolA}
        `;
        }
        html += `</div>`;
        /* =====================================================
           TARGET LP COMPOSITION
        ===================================================== */
        html += `
    <div class="result-box">
        <span class="badge">
            PancakeSwap V3 建池所需比例
        </span>
        <hr>
        ${symbolA}：
        <b class="blue">
            ${formatNumber(
            lp.amountA,
            12
        )}
        </b>
        <br>
        ${symbolB}：
        <b class="blue">
            ${formatNumber(
            lp.amountB,
            12
        )}
        </b>
        <hr>
        ${symbolA} 價值比例：
        <b>
            ${(lp.ratioA * 100).toFixed(4)}%
        </b>
        <br>
        ${symbolB} 價值比例：
        <b>
            ${(lp.ratioB * 100).toFixed(4)}%
        </b>
    </div>
    `;
        /* =====================================================
           SELL JUDGMENT
        ===================================================== */
        html += `
    <div class="result-box">
        <span class="badge">
            🔄 建池前需要賣哪個幣？
        </span>
        <hr>
    `;
        if (
            swap.action === "NONE"
        ) {
            html += `
        <span class="green">
            ✅ 不需要 Swap
        </span>
        <br><br>
        目前資產比例已經足夠接近
        PancakeSwap V3 建池比例。
        `;
        }
        else if (
            swap.action === "SELL_A"
        ) {
            html += `
        <span class="yellow">
            🔄 ${symbolA} 過多
        </span>
        <br><br>
        <span class="red">
            建議賣出：
        </span>
        <br>
        <b class="red big">
            ${formatNumber(
                swap.sellA,
                12
            )}
            ${symbolA}
        </b>
        <br><br>
        換取約：
        <br>
        <b class="green big">
            ${formatNumber(
                swap.receiveB,
                12
            )}
            ${symbolB}
        </b>
        <hr>
        賣出後：
        <br>
        ${symbolA}：
        <b>
            ${formatNumber(
                finalA,
                12
            )}
        </b>
        <br>
        ${symbolB}：
        <b>
            ${formatNumber(
                finalB,
                12
            )}
        </b>
        `;
        }
        else if (
            swap.action === "SELL_B"
        ) {
            html += `
        <span class="yellow">
            🔄 ${symbolB} 過多
        </span>
        <br><br>
        <span class="red">
            建議賣出：
        </span>
        <br>
        <b class="red big">
            ${formatNumber(
                swap.sellB,
                12
            )}
            ${symbolB}
        </b>
        <br><br>
        換取約：
        <br>
        <b class="green big">
            ${formatNumber(
                swap.receiveA,
                12
            )}
            ${symbolA}
        </b>
        <hr>
        賣出後：
        <br>
        ${symbolA}：
        <b>
            ${formatNumber(
                finalA,
                12
            )}
        </b>
        <br>
        ${symbolB}：
        <b>
            ${formatNumber(
                finalB,
                12
            )}
        </b>
        `;
        }
        html += `</div>`;
        /* =====================================================
           FINAL LP DEPOSIT
        ===================================================== */
        html += `
    <div class="result-box">
        <span class="badge">
            💧 最終建議投入 LP
        </span>
        <hr>
        ${symbolA}：
        <b class="big">
            ${formatNumber(
            lp.amountA,
            12
        )}
        </b>
        <br>
        ${symbolB}：
        <b class="big">
            ${formatNumber(
            lp.amountB,
            12
        )}
        </b>
        <hr>
        <span class="info">
        建池總價值：
        <b>
            ${formatNumber(
            total,
            2
        )}
            USDT
        </b>
        <br>
        交易前總價值：
        ${formatNumber(
            total,
            2
        )}
        USDT
        <br>
        交易後理論總價值：
        ${formatNumber(
            finalValue,
            2
        )}
        USDT
        </span>
    </div>
    `;
        /* =====================================================
           VALUE CHECK
        ===================================================== */
        html += `
    <div class="result-box">
        <span class="badge">
            計算檢查
        </span>
        <hr>
        總資產價值誤差：
        <b class="${
            Math.abs(valueError) < 0.01
                ? "green"
                : "red"
        }">
            ${formatNumber(
            Math.abs(valueError),
            8
        )}
            USDT
        </b>
        <br><br>
        <span class="info">
        ⚠️ 此計算為理論值。
        <br>
        實際 PancakeSwap Swap
        仍會受到：
        <br>
        • Swap Fee
        <br>
        • Price Impact
        <br>
        • Slippage
        <br>
        • Tick Rounding
        <br>
        • Token Decimal
        <br>
        • Pool Liquidity
        <br>
        • MEV
        <br><br>
        影響。
        </span>
    </div>
    `;
        document.getElementById(
            "result"
        ).innerHTML = html;
    }
    /* =========================================================
       ESCAPE HTML
    ========================================================= */
    function escapeHtml(
        text
    ) {
        return String(text)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }
    /* =========================================================
       NETWORK CHANGE
    ========================================================= */
    document
        .getElementById("network")
        .addEventListener(
            "change",
            async () => {
                const tokenA =
                    document
                        .getElementById(
                            "tokenASearch"
                        )
                        .value
                        .trim();
                const tokenB =
                    document
                        .getElementById(
                            "tokenBSearch"
                        )
                        .value
                        .trim();
                if (
                    tokenA ||
                    tokenB
                ) {
                    if (tokenA) {
                        await searchTokenImmediate(
                            "A",
                            tokenA
                        );
                    }
                    if (tokenB) {
                        await searchTokenImmediate(
                            "B",
                            tokenB
                        );
                    }
                    updatePairPrice();
                }
            }
        );
    /* =========================================================
       INITIALIZE
    ========================================================= */
    window.addEventListener(
        "load",
        async () => {
            setupSearch("A");
            setupSearch("B");
            await Promise.all([
                searchTokenImmediate(
                    "A",
                    "WMON"
                ),
                searchTokenImmediate(
                    "B",
                    "USDC"
                )
            ]);
            updatePairPrice();
            const marketPrice =
                getMarketPrice();
            if (marketPrice) {
                document.getElementById(
                    "currentPrice"
                ).value =
                    marketPrice;
            }
        }
    );
</script>
